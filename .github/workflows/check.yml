name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 detect.py --help
      - run: python3 -m py_compile detect.py
      - run: git diff --check
